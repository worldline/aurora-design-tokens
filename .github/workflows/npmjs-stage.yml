name: Build and stage public package on npm

on:
  push:
    branches:
      - main
    paths:
      - '.gitignore'
      - '.npmignore'
      - 'LICENSE'
      - 'LICENSES/**'
      - 'README.md'
      - 'build/**'
      - 'index.js'
      - 'npmjs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/npmjs/**'
      - 'src/**'
      - 'tokens/**'
      - 'tsconfig*.json'
  workflow_dispatch:
    inputs:
      expected_version:
        description: Package version to stage from the default branch
        required: true
        type: string

jobs:
  build:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      version_changed: ${{ steps.version.outputs.version_changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install npm 11.15.0
        run: npm install --global npm@11.15.0
      - name: Detect package version change
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          current_version="$(node -p 'require("./package.json").version')"
          printf 'package_version=%s\n' "$current_version" >> "$GITHUB_OUTPUT"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ -z "$EXPECTED_VERSION" || "$EXPECTED_VERSION" != "$current_version" ]]; then
              echo "Expected version does not match package.json; refusing to stage." >&2
              exit 1
            fi
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$PUSH_BEFORE" || "$PUSH_BEFORE" == "0000000000000000000000000000000000000000" ]] ||
             ! git cat-file -e "${PUSH_BEFORE}:package.json" 2>/dev/null; then
            echo "Previous mirror version is unavailable; build will run but automatic staging is skipped."
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous_version="$(git show "${PUSH_BEFORE}:package.json" | node -pe 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')"
          if [[ "$current_version" == "$previous_version" ]]; then
            echo "Package inputs changed, but the package version did not; staging is skipped."
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Package version changed from $previous_version to $current_version."
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare public package directory
        shell: bash
        run: |
          set -euo pipefail
          public_package_dir="$RUNNER_TEMP/npmjs-public-package"
          mkdir -p "$public_package_dir"
          tar --exclude=.git --exclude=.npmrc -cf - . | tar -xf - -C "$public_package_dir"
          node scripts/npmjs/prepare-public-package.mjs "$public_package_dir" "${{ github.repository }}" --retain-scripts
      - name: Regenerate public lockfile
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/npmjs-public-package"
          npm install --ignore-scripts --package-lock-only --registry=https://registry.npmjs.org/
      - name: Install public dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/npmjs-public-package"
          npm ci --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Build public package
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/npmjs-public-package"
          npm run build
      - name: Finalize public package manifest
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/npmjs-public-package"
          node scripts/npmjs/finalize-public-package.mjs .
      - name: Pack public package
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.package_version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/npmjs-public-package"
          npm pack --ignore-scripts --json > pack.json
          tarball="$(node -e 'const pack = require("./pack.json"); process.stdout.write(pack[0].filename)')"
          test -s "$tarball"
          node scripts/npmjs/verify-public-tarball.mjs "$tarball" pack.json "${{ github.repository }}" "$EXPECTED_VERSION"
          mkdir -p "$GITHUB_WORKSPACE/npmjs-artifact"
          cp "$tarball" "$GITHUB_WORKSPACE/npmjs-artifact/"
          cp pack.json "$GITHUB_WORKSPACE/npmjs-artifact/pack.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: npmjs-public-package
          path: |
            npmjs-artifact/*.tgz
            npmjs-artifact/pack.json
          if-no-files-found: error
  stage:
    needs: build
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'push' &&
       needs.build.outputs.version_changed == 'true')
    runs-on: ubuntu-latest
    environment: npmjs-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          package-manager-cache: false
      - name: Install npm 11.15.0
        run: npm install --global npm@11.15.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: npmjs-public-package
          path: npmjs-artifact
      - name: Reverify exact public tarball
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.package_version }}
        run: |
          set -euo pipefail
          artifact_dir="$GITHUB_WORKSPACE/npmjs-artifact"
          tarball_name="$(node -e 'const pack = require(process.argv[1]); process.stdout.write(pack[0].filename)' "$artifact_dir/pack.json")"
          tarball="$artifact_dir/$tarball_name"
          test -s "$tarball"
          node scripts/npmjs/verify-public-tarball.mjs "$tarball" "$artifact_dir/pack.json" "$GITHUB_REPOSITORY" "$EXPECTED_VERSION"
          printf 'NPMJS_TARBALL=%s\n' "$tarball" >> "$GITHUB_ENV"
      - name: Stage public tarball with npm OIDC
        run:
          npm stage publish "${{ env.NPMJS_TARBALL }}"
          --registry=https://registry.npmjs.org/ --ignore-scripts
